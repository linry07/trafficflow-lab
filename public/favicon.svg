<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Dark ring highway backdrop -->
  <rect width="64" height="64" rx="14" fill="#090d16"/>
  <circle cx="32" cy="32" r="23" stroke="#1e293b" stroke-width="8"/>
  <circle cx="32" cy="32" r="23" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  
  <!-- Flowing vehicle markers on ring (Green = free flow, Amber = deceleration, Red = jam wave) -->
  <!-- Top green vehicle -->
  <circle cx="32" cy="9" r="3.5" fill="#10b981"/>
  <!-- Top-right green vehicle -->
  <circle cx="48" cy="16" r="3.5" fill="#10b981"/>
  <!-- Right amber vehicle -->
  <circle cx="55" cy="32" r="3.5" fill="#f59e0b"/>
  <!-- Bottom-right red vehicle (jam node) -->
  <circle cx="48" cy="48" r="3.5" fill="#ef4444"/>
  <!-- Bottom red vehicle (jam node) -->
  <circle cx="32" cy="55" r="3.5" fill="#ef4444"/>
  <!-- Bottom-left amber vehicle -->
  <circle cx="16" cy="48" r="3.5" fill="#f59e0b"/>
  <!-- Left green vehicle -->
  <circle cx="9" cy="32" r="3.5" fill="#10b981"/>
  <!-- Top-left green vehicle -->
  <circle cx="16" cy="16" r="3.5" fill="#10b981"/>

  <!-- Center dynamic pulse icon / waveform node -->
  <circle cx="32" cy="32" r="6" fill="#3b82f6" fill-opacity="0.3"/>
  <circle cx="32" cy="32" r="3" fill="#60a5fa"/>
</svg>
